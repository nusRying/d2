name: TALA JS migration CI

on:
  push:
    branches:
      - "tala-js/**"
    paths:
      - ".github/workflows/tala-js-ci.yml"
      - "d2layouts/d2talalayout/js/src/**"
      - "d2layouts/d2talalayout/js/test/**"
      - "d2layouts/d2talalayout/js/package.json"
      - "d2layouts/d2talalayout/internal/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/tala-js-ci.yml"
      - "d2layouts/d2talalayout/js/src/**"
      - "d2layouts/d2talalayout/js/test/**"
      - "d2layouts/d2talalayout/js/package.json"
      - "d2layouts/d2talalayout/internal/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tala-js-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JavaScript parity suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: d2layouts/d2talalayout/js
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Show Bun version
        run: bun --version

      - name: Run full TALA JavaScript test suite
        run: bun test

  go:
    name: Go parity packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Test limits
        run: go test -count=1 ./d2layouts/d2talalayout/internal/limits/...

      - name: Test layoutgraph
        run: go test -count=1 ./d2layouts/d2talalayout/internal/layoutgraph/...

      - name: Test placementcost
        run: go test -count=1 ./d2layouts/d2talalayout/internal/placementcost/...

      - name: Generate Slice 43 compaction oracle
        env:
          TALA_SLICE43_ORACLE: "1"
        run: go test -count=1 -run TestSlice43CompactionOracle -v ./d2layouts/d2talalayout/internal/placement/...

      - name: Test placement
        run: go test -count=1 ./d2layouts/d2talalayout/internal/placement/...

      - name: Test proximity
        run: go test -count=1 ./d2layouts/d2talalayout/internal/proximity/...

      - name: Test grouping
        run: go test -count=1 ./d2layouts/d2talalayout/internal/grouping/...

  hygiene:
    name: Diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
