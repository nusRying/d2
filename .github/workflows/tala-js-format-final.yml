name: TALA JS final Go formatter

on:
  push:
    branches:
      - tala-js/slice-50-engine-public-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true
      - name: Format Go files introduced by the TALA migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          mapfile -t files < <(
            git diff --name-only origin/master...HEAD -- 'd2layouts/d2talalayout/**/*.go'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files."
            exit 0
          fi

          printf '%s\n' "${files[@]}" | xargs gofmt -s -w
          printf '%s\n' "${files[@]}" | xargs -n 64 \
            go run golang.org/x/tools/cmd/goimports@v0.4.0 -w \
            -local=oss.terrastruct.com,github.com/terrastruct,github.com/d2lang

          if git diff --quiet -- "${files[@]}"; then
            echo "Go files already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(tala-js): format Go oracle support files"
          git push origin HEAD:tala-js/slice-50-engine-public-e2e
